version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pm_helper_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - pm_helper_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: pm_helper_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pm_helper_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: pm_helper_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pm_helper}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-pm_helper}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3307:3306"
    volumes:
      - pm_helper_db_data:/var/lib/mysql
    networks:
      - pm_helper_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pm_helper_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:listen --sleep=3 --tries=3 --timeout=120 --queue=default
    volumes:
      - ./:/var/www
    networks:
      - pm_helper_network
    depends_on:
      db:
        condition: service_healthy

networks:
  pm_helper_network:
    driver: bridge

volumes:
  pm_helper_db_data:
    driver: local
